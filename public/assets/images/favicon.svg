<svg xmlns="http://www.w3.org/2000/svg" viewBox="106 44 416 416" fill="none">
  <defs>
    <linearGradient id="raGrad" gradientUnits="userSpaceOnUse" x1="120" y1="90" x2="470" y2="450">
      <stop offset="0" stop-color="#F8B85A"/>
      <stop offset="0.5" stop-color="#F38E6A"/>
      <stop offset="1" stop-color="#EC6C7E"/>
    </linearGradient>
  </defs>

  <!-- viewBox is cropped to the artwork (not 0 0 512 512) and strokes are heavy
       so the icon fills the browser-tab slot like other sites' favicons. -->
  <g stroke="url(#raGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Clipboard body -->
    <rect x="128" y="104" width="252" height="324" rx="30"/>

    <!-- Clip with hanger tab -->
    <rect x="196" y="100" width="120" height="54" rx="16"/>
    <path d="M236 100 L236 84 Q236 72 256 72 Q276 72 276 84 L276 100"/>

    <!-- Binding marks (left margin) -->
    <path d="M156 190 L156 206"/>
    <path d="M156 250 L156 266"/>

    <!-- Avatar -->
    <circle cx="256" cy="214" r="58"/>
    <circle cx="256" cy="195" r="13"/>
    <path d="M228 250 Q228 230 256 230 Q284 230 284 250"/>

    <!-- Text lines -->
    <path d="M196 334 L300 334"/>
    <path d="M196 372 L300 372"/>

    <!-- Pencil -->
    <g transform="translate(420 296) rotate(45)">
      <path d="M-18 62 L-18 -92 Q-18 -104 -6 -104 L6 -104 Q18 -104 18 -92 L18 62 L0 116 Z"/>
      <path d="M-18 -66 L18 -66"/>
      <path d="M-18 62 L18 62"/>
    </g>
  </g>
</svg>
